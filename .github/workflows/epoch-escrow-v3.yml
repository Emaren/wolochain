name: Held epoch v3 native evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-epoch-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: epoch_v3_hd940
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d epoch_v3_hd940"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      GOFLAGS: -tags=go1.27
      WOLO_EPOCH_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      WOLO_EPOCH_HD940_TEST_PG_DSN: postgres://postgres:isolated-test-only@127.0.0.1:5432/epoch_v3_hd940?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Install bounded isolated compatibility-test dependencies
        run: npm install --prefix "$RUNNER_TEMP/epoch-v3-hd" --ignore-scripts --no-audit --no-fund tsx@4.20.6 pg@8.16.3
      - name: Fresh native SDK funding, fee-paying MsgSend0, dual-account bank and return proofs
        env:
          WOLO_EPOCH_GOLDEN_OUT: ${{ runner.temp }}/epoch-v3-golden.json
        run: python3 scripts/check-epoch-escrow-native-v3.py
      - name: Actual HD 940 source economics and disposable PG16 ticket parity
        env:
          WOLO_EPOCH_GOLDEN_OUT: ${{ runner.temp }}/epoch-v3-golden.json
          WOLO_EPOCH_HD940_NODE_MODULES: ${{ runner.temp }}/epoch-v3-hd/node_modules
        run: '"$RUNNER_TEMP/epoch-v3-hd/node_modules/.bin/tsx" scripts/check-epoch-escrow-hd940.mts'
      - name: Held escrow policy, journal, unknown outcomes and command
        run: go test -race ./internal/epochescrow ./cmd/woloescrowd -count=1
      - name: Retain public SDK-derived golden evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: epoch-v3-native-hd940-golden-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/epoch-v3-golden.json
          if-no-files-found: ignore
          retention-days: 14
