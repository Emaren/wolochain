name: Original source build-script exact-byte review (NONAUTHORIZING)
on:
  push:
    branches:
      - review/20261024-historical-build-script-evidence-held
  pull_request:
    branches:
      - review/20261024-legacy-exact-byte-rebuild-held

permissions:
  contents: read

jobs:
  historical-source-script:
    name: Pinned original build-linux-amd64.sh candidate; source P1 held
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOFLAGS: -trimpath
      CGO_ENABLED: '1'
      GOAMD64: v1
    steps:
      - name: Checkout read-only reviewer at exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: review
          persist-credentials: false
      - name: Checkout exact historical settlement source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 78c25985420ee41a6678c42fab8ea8d6c3b1b519
          path: legacy
          persist-credentials: false
      - name: Use actual observed Go toolchain (not old Oct 1 CI toolchain)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.26.0
          cache: false
      - name: Verify historical build script itself is exact old Git blob
        shell: bash {0}
        run: |
          echo 'STEP 1: Verify exact historical checkout and script identity'
          head="$(git -C legacy rev-parse HEAD 2>&1)"
          git_rc=$?
          blob="$(git -C legacy rev-parse 'HEAD:scripts/build-linux-amd64.sh' 2>&1)"
          blob_rc=$?
          echo "GIT_RC=$git_rc BLOB_RC=$blob_rc HEAD=$head BLOB=$blob"
          if [ "$git_rc" -ne 0 ] || [ "$blob_rc" -ne 0 ] || [ "$head" != '78c25985420ee41a6678c42fab8ea8d6c3b1b519' ] || [ "$blob" != 'b152c1b3bf74b3a6b6023ee39b8babc75dd2926f' ]; then
            echo 'ERROR=Original historical build script/source identity mismatch'
            echo 'RC=2 BLOCKED'; exit 2
          fi
          echo 'RC=0 PASS original source and original script'
      - name: Test nonauthorizing verifier and refusal cases
        shell: bash {0}
        run: |
          echo 'STEP 2: Run existing 13 negative and NONAUTHORIZING tests'
          python3 -m unittest discover -v -s review/tests -p 'test_settlement_legacy_exact_byte_reproduction_review.py'
          rc=$?
          echo "UNIT_TEST_RC=$rc"
          if [ "$rc" -ne 0 ]; then echo 'RC=2 BLOCKED unit tests'; exit 2; fi
          echo 'RC=0 PASS reviewer contract only'
      - name: Build via exact original historical script and compare LIVE SHA
        shell: bash {0}
        run: |
          echo 'STEP 3: Isolated original-source build script; never touch a production host'
          go version
          cd legacy
          cd_rc=$?
          echo "WORKDIR_RC=$cd_rc"
          if [ "$cd_rc" -ne 0 ]; then echo 'RC=2 BLOCKED cannot enter original Go module'; exit 2; fi
          bash scripts/build-linux-amd64.sh "$RUNNER_TEMP/settlement-old-script-candidate"
          build_rc=$?
          cd ..
          echo "HISTORICAL_SCRIPT_BUILD_RC=$build_rc"
          if [ "$build_rc" -ne 0 ]; then
            echo 'ERROR=Original script build failed in isolated runner'
            echo 'RC=2 BLOCKED; ORIGINAL_DEPLOYMENT_PROVENANCE_UNKNOWN'
            exit 2
          fi
          echo 'STEP 4: Verify exact byte digest and embedded production settings'
          python3 review/scripts/settlement_legacy_exact_byte_reproduction_review.py --binary "$RUNNER_TEMP/settlement-old-script-candidate" --source-dir legacy
          review_rc=$?
          echo "BYTE_COMPARISON_RC=$review_rc"
          if [ "$review_rc" -ne 0 ]; then
            echo 'RC=2 BLOCKED exact live bytes NOT reproduced via historic script'
            echo 'FINANCIAL_RELEASE_AUTHORIZED=false WEBSITE_RELEASE_AUTHORIZED=false'
            exit 2
          fi
          echo 'RC=0 PASS EXACT_SOURCE_BYTES_ONLY; original builder identity/deploy receipt STILL NOT ATTESTED'
          echo 'FINANCIAL_RELEASE_AUTHORIZED=false WEBSITE_RELEASE_AUTHORIZED=false'
