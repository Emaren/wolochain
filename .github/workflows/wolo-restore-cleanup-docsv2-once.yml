name: One-shot Wolo isolated restore cleanup DocsV2 seal (HELD / NO DEPLOY)

on:
  push:
    branches:
      - review/20261024-disk-backed-isolated-restore-held

permissions:
  contents: write

concurrency:
  group: wolo-restore-cleanup-exact-docsv2-20261024
  cancel-in-progress: false

jobs:
  seal:
    if: github.repository == 'Emaren/wolochain' && github.ref == 'refs/heads/review/20261024-disk-backed-isolated-restore-held'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Self-retire before canonical implementation baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/wolo-restore-cleanup-docsv2-once.yml
          git commit -m "ci(HELD): retire temporary Wolo restore DocsV2 helper"
      - name: Source-bound DocsV2 seal only (NO FINANCIAL RELEASE)
        run: |
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          python3 scripts/docs_v2_check.py
          python3 - <<'PY'
          import subprocess
          allowed={'catalog-info.yaml','docs/DOCUMENTATION_CONTROL_PLANE.md','docs/document-registry.json'}
          dirty=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          if (dirty|untracked)-allowed:
              raise SystemExit('STOP unexpected generated changes '+str(sorted((dirty|untracked)-allowed)))
          print('DocsV2 changed:',sorted(dirty))
          PY
          git add -- catalog-info.yaml docs/DOCUMENTATION_CONTROL_PLANE.md docs/document-registry.json
          git diff --cached --quiet || git commit -m "docs(HELD): reseal restore receipt cleanup ordering and tests"
          git push origin HEAD:refs/heads/review/20261024-disk-backed-isolated-restore-held
