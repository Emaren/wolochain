name: One-shot producer triage docs baseline

on:
  push:
    branches:
      - audit/20261019-producer-evidence-join
    paths:
      - ".producer-triage-doc-trigger"

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Exact branch checkout
        uses: actions/checkout@v4
        with:
          ref: audit/20261019-producer-evidence-join
          fetch-depth: 0
          persist-credentials: true
      - name: Retire one-shot worker and seal documented source
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "audit/20261019-producer-evidence-join"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-producer-triage-docs.yml .producer-triage-doc-trigger
          git commit -m "chore(finance): retire one-shot correlation docs worker"
          python3 scripts/docs_v2_check.py --write --refresh-baseline \
            --branch audit/20261019-producer-evidence-join \
            --head "$(git rev-parse HEAD)"
          python3 scripts/docs_v2_check.py
          git add docs/DOCUMENTATION_CONTROL_PLANE.md docs/document-registry.json catalog-info.yaml
          if ! git diff --cached --quiet; then
            git commit -m "docs(finance): bind producer review to exact source"
          fi
          test -z "$(git status --porcelain)"
          git push origin HEAD:audit/20261019-producer-evidence-join
