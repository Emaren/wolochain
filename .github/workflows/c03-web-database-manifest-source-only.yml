name: C03 website HD-only SQL manifest source/permit negative contract

on:
  pull_request:
    paths:
      - 'scripts/c03_web_database_admission_manifest_v1.json'
      - 'scripts/c03_web_database_admission_manifest_check.py'
      - 'tests/test_c03_web_database_manifest_source_only.py'
      - 'scripts/c03_library_public_projection_candidate.sql'
      - 'scripts/c03_library_public_projection_inverse_candidate.sql'
      - 'scripts/c03_hd_gateway_v2_restricted_install_candidate.sql'
      - 'scripts/c03_hd_gateway_v2_restricted_inverse_candidate.sql'
      - '.github/workflows/c03-web-database-manifest-source-only.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-manifest:
    name: Exact 4 SQL blobs + 12 negative permits, source-only
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pin independent source artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" != 0
          test "$(git hash-object scripts/c03_web_database_admission_manifest_v1.json)" = 'cc93e7a926d185cfb7cbddff038cef40c835150f'
          test "$(git hash-object scripts/c03_web_database_admission_manifest_check.py)" = '65e44ac952327317a84a6e5e8fd5017940feda67'
          test "$(git hash-object tests/test_c03_web_database_manifest_source_only.py)" = '4ab483be3c89948e98639f8963c0ff8be561b9c1'
      - name: Run 12 adversarial manifest tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest -v tests/test_c03_web_database_manifest_source_only.py
      - name: Prove plan has no installation actuator
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 -B scripts/c03_web_database_admission_manifest_check.py --plan > /tmp/c03-web-db-manifest-plan.txt
          grep -F -q '"installation_authorized": false' /tmp/c03-web-db-manifest-plan.txt
          grep -F -q '"financial_authorized": false' /tmp/c03-web-db-manifest-plan.txt
          grep -F -q 'C03_WEB_DB_SOURCE_ONLY_NOT_ROOT_OR_SQL_PERMIT' /tmp/c03-web-db-manifest-plan.txt
          if python3 -B scripts/c03_web_database_admission_manifest_check.py --execute > /tmp/c03-web-db-denied.txt 2>&1; then
            echo 'FAIL unsafe execution mode unexpectedly admitted'; exit 1
          fi
      - name: Explicit live-install HOLD
        run: echo 'Physical owner/root maintenance admission, HBA, Unix peer, and live privacy must be independently witnessed. C03 OPEN, financial funding DENIED.'
