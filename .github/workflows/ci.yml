name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  financial_timer_source:
    name: Financial timer source checks (no authority)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic crypto and isolated four-unit model
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s scripts -p test_financial_timer_quarantine.py -v

  foundation:
    name: Foundation checks
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -tags=go1.27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.54.0

      - name: Build wolochaind
        run: go build ./cmd/wolochaind

      - name: Settlement tests
        run: go test ./cmd/wolochaind/cmd -count=1

      - name: Full repo tests
        run: go test ./...

      - name: Operator script syntax
        run: bash -n scripts/*.sh

      - name: Chain invariant guard
        run: WOLO_SKIP_RUNTIME_CHECKS=1 ./scripts/check-chain-invariants.sh

      - name: Generated proto drift
        run: ./scripts/check-generated-protos.sh
