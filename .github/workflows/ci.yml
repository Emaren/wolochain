name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - wolo-1-mainnet-prep

permissions:
  contents: read

jobs:
  hd-wolo-exact-wire:
    name: Exact HD ↔ Wolo 8094 source pair (NONAUTHORIZING)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact Wolo source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned held HD funded source (no keys, no build)
        uses: actions/checkout@v4
        with:
          repository: Emaren/app-prodn
          ref: a37c9790dbf0e7038cded62802954da788b3ad5f
          path: hd-funded-source
          persist-credentials: false
          sparse-checkout: |
            lib/warSatchelDedicatedSignerClient.ts
            lib/warSatchelFinancialBridgeHold.ts
            lib/warSatchelFundedAdmission.ts
          sparse-checkout-cone-mode: false

      - name: Real pinned pair must match static wire and still HOLD funded money
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set +e
          python3 scripts/settlement_hd_satchel_wire_review.py \
            --wolo-root "$GITHUB_WORKSPACE" \
            --hd-root "$GITHUB_WORKSPACE/hd-funded-source" \
            --expect-wolo-sha "$GITHUB_SHA" \
            --expect-hd-sha a37c9790dbf0e7038cded62802954da788b3ad5f \
            > "$RUNNER_TEMP/hd-wolo-static-wire.json"
          status=$?
          set -e
          test "$status" -eq 3 || { echo 'Wire CLI did not return documented NONAUTHORIZING HOLD'; exit 1; }
          python3 - "$RUNNER_TEMP/hd-wolo-static-wire.json" <<'PY'
          import json, sys
          from pathlib import Path
          x=json.loads(Path(sys.argv[1]).read_text())
          assert x["status"]=="HOLD"
          assert x["static_wire_surface_matches"] is True, x["source_shape_gaps"]
          assert x["source_shape_gaps"] == []
          assert x["hd_source_sha"]=="a37c9790dbf0e7038cded62802954da788b3ad5f"
          assert x["wolo_source_sha"]==__import__("os").environ["GITHUB_SHA"]
          assert len(x["source_file_sha256"])==5
          assert x["dedicated_8094_runtime_custody_proven"] is False
          assert x["historical_consensus_trust_authenticated"] is False
          assert x["same_height_solvency_certified"] is False
          assert x["financial_release_authorized"] is False
          print("EXACT_HD_WOLO_SOURCE_WIRE_MATCH=PASS; FUNDED_RELEASE=HOLD")
          PY

  financial-maintenance:
    name: Disposable settlement maintenance mechanics
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Guarded current settlement code-only cutover and fault rollback (offline)
        run: |
          python3 -m unittest discover -s tests -p 'test_settlement_bdbce253_code_cutover.py' -v
          python3 -m unittest discover -s tests -p 'test_settlement_financial_maintenance.py' -v

      - name: Disposable systemd watchdog and producer activation mechanics (not mainnet)
        run: sudo env CI=true WOLO_DISPOSABLE_SYSTEMD_TEST=1 PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_settlement_first_rehearsal_systemd.py' -v

      - name: Actual isolated PostgreSQL dump and restore (synthetic HD and DE)
        if: ${{ always() && !cancelled() }}
        env:
          WOLO_RESTORE_TEST_IMAGE: postgres@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
          RUN_WOLO_ISOLATED_RESTORE_TESTS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          docker --host=unix:///var/run/docker.sock pull "$WOLO_RESTORE_TEST_IMAGE"
          python3 tests/test_settlement_financial_maintenance.py ActualIsolatedRestoreTests -v


  reviewer-postgres:
    name: Independent reviewer PostgreSQL observation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: satchel_reviewer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d satchel_reviewer_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      GOFLAGS: -tags=go1.27
      SATCHEL_REVIEWER_TEST_PG_DSN: postgres://postgres:isolated-test-only@127.0.0.1:5432/satchel_reviewer_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Actual dedicated login, column grants and per-owner reconciliation
        run: go test -race ./internal/satchelservice -run '^TestReviewerFinancePostgres' -count=1 -v
  foundation:
    name: Foundation checks
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -tags=go1.27

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Documentation authority verifies the recorded implementation ancestor.
          fetch-depth: 0

      - name: Source-bound documentation
        run: python3 scripts/docs_v2_check.py

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.54.0
          github_token: ${{ github.token }}

      - name: Build wolochaind
        run: go build ./cmd/wolochaind

      - name: Settlement tests
        run: go test ./cmd/wolochaind/cmd -count=1

      - name: Exact settlement confirmation race contracts
        run: go test -race ./cmd/wolochaind/cmd -count=1

      - name: Vet source contracts
        run: go vet ./...

      - name: Read-only Satchel and shared event adversarial contracts
        run: go test -race ./internal/satchel ./internal/chainevents -count=1

      - name: Full repo tests
        run: go test ./...

      - name: Operator script syntax
        run: for script in scripts/*.sh; do bash -n "$script" || exit; done

      - name: Financial maintenance and activation blind-spot contracts (read only)
        run: |
          python3 -m unittest discover -s tests -p 'test_settlement_maintenance_board.py' -v
          python3 -m unittest discover -s tests -p 'test_settlement_producer_activation_topology.py' -v
          python3 -m unittest discover -s tests -p 'test_settlement_auxiliary_producer_surfaces.py' -v

      - name: Founder request-state forensics contracts (read only)
        run: python3 -m unittest discover -s tests -p 'test_settlement_founder15_state_readonly.py' -v

      - name: Legacy settlement rollback retirement (offline)
        run: python3 -m unittest discover -s tests -p 'test_settlement_legacy_rollback_quiescence.py' -v

      - name: Current settlement candidate provenance (offline)
        run: python3 -m unittest discover -s tests -p 'test_settlement_current_provenance.py' -v

      - name: Current two-service release preflight and snapshot guards (offline)
        run: python3 -m unittest discover -s tests -p 'test_settlement_current_two_lane_preflight.py' -v

      - name: Current settlement recovery-state planner (nonmutating)
        run: python3 -m unittest discover -s tests -p 'test_settlement_bdbce253_recovery_plan.py' -v

      - name: Settlement-only fault-injection dry run (offline synthetic files)
        run: |
          python3 -m unittest discover -s tests -p 'test_settlement_bdbce253_offline_rehearsal.py' -v
          python3 scripts/settlement_bdbce253_offline_rehearsal.py --simulate-all

      - name: Shared HD and DE payout ingress inventory guard (nonmutating)
        run: python3 -m unittest discover -s tests -p 'test_settlement_shared_producer_inventory_readonly.py' -v

      - name: Exact settlement-bearer holder observation contract (offline, nonauthorizing)
        run: python3 -m unittest discover -s tests -p 'test_settlement_bearer_holders_readonly.py' -v

      - name: DE independent source-signer and read-triggered payment census (nonmutating)
        run: python3 -m unittest discover -s tests -p 'test_settlement_de_producer_source_map.py' -v

      - name: HD/DE runtime producer owner review (read only, nonauthorizing)
        run: python3 -m unittest discover -s tests -p 'test_settlement_producer_owner_triage.py' -v

      - name: Settlement journal amount evidence and uncertainty (read only)
        run: python3 -m unittest discover -s tests -p 'test_settlement_state_evidence.py' -v

      - name: HD non-additive financial obligation evidence contracts (read only)
        run: python3 -m unittest discover -s tests -p 'test_settlement_financial_obligation_envelope.py' -v

      - name: Same-height financial arithmetic and missing-evidence negatives (HOLD only)
        run: python3 -m unittest discover -s tests -p 'test_settlement_financial_one_height_arithmetic.py' -v

      - name: Real single-owner phase signature review, NONAUTHORIZING (synthetic keys)
        run: python3 -m unittest discover -s tests -p 'test_settlement_solo_owner_intent_review.py' -v

      - name: Cross-repo HD-only Wolo 8094 wire surface adversarial admission (NONAUTHORIZING)
        run: python3 -m unittest discover -s tests -p 'test_settlement_hd_satchel_wire_review.py' -v

      - name: Financial six-control evidence HOLD audit (offline, never approval)
        run: |
          python3 scripts/financial_release_checklist_audit.py
          python3 -m unittest discover -s tests -p 'test_financial_release_checklist_audit.py' -v

      - name: Two-filesystem predeploy capacity gate (nonmutating)
        run: python3 -m unittest discover -s tests -p 'test_settlement_predeploy_capacity_readonly.py' -v

      - name: Website HOLD evidence contract (non-authorizing)
        run: |
          python3 -m venv "$RUNNER_TEMP/wolo-evidence-contract"
          "$RUNNER_TEMP/wolo-evidence-contract/bin/python" -m pip install -r tests/requirements-release-evidence.txt
          "$RUNNER_TEMP/wolo-evidence-contract/bin/python" -m unittest discover -s tests -p 'test_website_hold_evidence_contract.py' -v

      - name: Versioned private Satchel wire contract
        run: python3 -m unittest discover -s tests -p 'test_satchel_http_contract.py' -v

      - name: Build isolated Satchel service
        run: go build ./cmd/wolosatcheld

      - name: Satchel custody execution race contracts
        run: go test -race ./internal/satchelservice ./cmd/wolosatcheld -count=1

      - name: Chain invariant guard
        run: WOLO_SKIP_RUNTIME_CHECKS=1 ./scripts/check-chain-invariants.sh

      - name: Generated proto drift
        run: ./scripts/check-generated-protos.sh
