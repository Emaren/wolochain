name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -tags=go1.27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.54.0

      - name: Build wolochaind
        run: |
          mkdir -p build
          go build -o build/wolochaind ./cmd/wolochaind

      - name: Settlement tests
        run: go test ./cmd/wolochaind/cmd -count=1

      - name: Full repo tests
        run: go test ./...

      - name: Operator script syntax
        run: bash -n scripts/*.sh

      - name: Chain invariant guard
        run: WOLO_SKIP_RUNTIME_CHECKS=1 ./scripts/check-chain-invariants.sh

      - name: Generated proto drift
        run: ./scripts/check-generated-protos.sh

      - name: Financial candidate receipt checks
        run: python3 -m unittest discover -s scripts -p test_financial_build_receipt.py

      - name: Record quarantined build identity
        run: python3 scripts/financial-build-receipt.py --source-sha "$GITHUB_SHA"

      - name: Retain non-authorizing candidate
        uses: actions/upload-artifact@v4
        with:
          name: quarantined-wolochaind-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/wolochaind
            build/financial-build-candidate.json
          if-no-files-found: error
          retention-days: 7
