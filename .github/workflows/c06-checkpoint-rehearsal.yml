name: C06 isolated checkpoint archive and orchestration rehearsal
on:
  pull_request:
    paths:
      - scripts/settlement_c06_checkpoint_rehearsal.py
      - tests/test_settlement_c06_checkpoint_rehearsal.py
      - .github/workflows/c06-checkpoint-rehearsal.yml
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated fixture dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-16 age
      - name: Unprivileged isolated contract and physical PG16 age recovery tests
        env:
          C06_PG_BIN: /usr/lib/postgresql/16/bin
          C06_AGE: /usr/bin/age
          C06_AGE_KEYGEN: /usr/bin/age-keygen
        run: python3 -B tests/test_settlement_c06_checkpoint_rehearsal.py -v
