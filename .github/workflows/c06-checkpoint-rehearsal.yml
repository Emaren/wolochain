name: C06 isolated checkpoint archive and orchestration rehearsal
on:
  pull_request:
    paths:
      - scripts/settlement_c06_checkpoint_rehearsal.py
      - tests/test_settlement_c06_checkpoint_rehearsal.py
      - .github/workflows/c06-checkpoint-rehearsal.yml
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Unprivileged isolated contract tests
        run: python3 -B tests/test_settlement_c06_checkpoint_rehearsal.py -v
