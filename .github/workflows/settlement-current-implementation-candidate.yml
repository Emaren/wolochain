name: Current mainnet settlement implementation candidate (NO DEPLOY)

on:
  pull_request:
    branches: [wolo-1-mainnet-prep]
    paths:
      - ".github/workflows/settlement-current-implementation-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Source-pinned financial settlement candidate — NON-PROMOTING
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      EXPECTED_SOURCE: bdbce253c524d6faac14f61cd129ac5072287c3f
      CANDIDATE_DIR: /tmp/wolo-settlement-bdbce253
    steps:
      - name: Checkout exact governed financial implementation, not PR head
        uses: actions/checkout@v4
        with:
          ref: bdbce253c524d6faac14f61cd129ac5072287c3f
          fetch-depth: 1
          persist-credentials: false

      - name: Fail closed on source or dirty tree mismatch
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE" || exit 2
          test -z "$(git status --porcelain)" || exit 2
          test "$(git rev-parse --is-shallow-repository)" = true || exit 2
          echo "SOURCE VERIFIED: $EXPECTED_SOURCE"
          echo "NO DEPLOY, NO MAINNET SERVICE MUTATION"

      - name: Set up exact implementation Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Exact settlement and financial regression contracts
        shell: bash
        run: |
          go test -tags go1.27 ./cmd/wolochaind/cmd -count=1
          go test -tags go1.27 -race ./cmd/wolochaind/cmd -count=1
          go test -tags go1.27 -race ./internal/satchel ./internal/chainevents -count=1
          go vet -tags go1.27 ./cmd/wolochaind/cmd

      - name: Build untouched, source-proven linux/amd64 candidate
        shell: bash
        run: |
          mkdir -p "$CANDIDATE_DIR"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -tags go1.27 -o "$CANDIDATE_DIR/wolochaind-settlement-only-linux-amd64" ./cmd/wolochaind
          go version -m "$CANDIDATE_DIR/wolochaind-settlement-only-linux-amd64" > "$CANDIDATE_DIR/go-build-metadata.txt"
          grep -F "vcs.revision=$EXPECTED_SOURCE" "$CANDIDATE_DIR/go-build-metadata.txt"
          grep -F 'vcs.modified=false' "$CANDIDATE_DIR/go-build-metadata.txt"
          (cd "$CANDIDATE_DIR" && sha256sum wolochaind-settlement-only-linux-amd64 > SHA256SUMS)
          printf 'implementation_sha=%s\nproduction_authorized=false\nconsensus_upgrade_authorized=false\nfinancial_drain_certified=false\nfounder_889_resolved=false\nrollback_certified=false\n' "$EXPECTED_SOURCE" > "$CANDIDATE_DIR/AUTHORITY.txt"
          (cd "$CANDIDATE_DIR" && sha256sum -c SHA256SUMS)
          echo "SOURCE-CHECKED SETTLEMENT CANDIDATE ONLY — NOT APPROVED FOR PRODUCTION"

      - name: Preserve immutable build provenance for independent review
        uses: actions/upload-artifact@v4
        with:
          name: settlement-bdbce253-linux-amd64-UNDEPLOYED
          path: /tmp/wolo-settlement-bdbce253/
          if-no-files-found: error
          retention-days: 14
