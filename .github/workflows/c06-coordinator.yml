name: C06 durable coordinator crash boundaries
on:
  pull_request:
    paths:
      - scripts/settlement_c06_native_service_barrier.py
      - scripts/settlement_c06_native_pg_checkpoint.py
      - tests/test_settlement_c06_native_pg_checkpoint.py
      - tests/test_settlement_c06_native_service_barrier.py
      - tests/test_settlement_c06_physical_systemd_barrier.py
      - scripts/settlement_c06_native_witness.py
      - tests/test_settlement_c06_native_witness.py
      - tests/test_settlement_c06_barrier_completion.py
      - scripts/settlement_c06_checkpoint_authority.py
      - tests/test_settlement_c06_checkpoint_authority.py
      - scripts/settlement_c06_checkpoint_coordinator.py
      - tests/test_settlement_c06_checkpoint_coordinator.py
      - .github/workflows/c06-coordinator.yml
permissions:
  contents: read
jobs:
  coordinator:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: sudo apt-get update -qq && sudo apt-get install -y postgresql-16
      - env:
          C06_PG_BIN: /usr/lib/postgresql/16/bin
        run: python3 -B tests/test_settlement_c06_checkpoint_coordinator.py -v

      - run: python3 -B tests/test_settlement_c06_checkpoint_authority.py -v
      - run: python3 -B tests/test_settlement_c06_native_witness.py -v
      - run: python3 -B tests/test_settlement_c06_barrier_completion.py -v

      - run: python3 -B tests/test_settlement_c06_native_service_barrier.py -v
      - run: python3 -B tests/test_settlement_c06_native_pg_checkpoint.py -v
  physical-systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Actual disposable systemd activation denial and crash retention
        run: sudo env CI=true GITHUB_ACTIONS=true C06_DISPOSABLE_BARRIER=1 /usr/bin/python3 -B tests/test_settlement_c06_physical_systemd_barrier.py -v
