name: Settlement-only candidate (NO DEPLOY)
on:
  pull_request:
    branches: [wolo-1-mainnet-prep]
    paths:
      - ".github/workflows/settlement-only-candidate.yml"
      - "scripts/settlement-only-provenance.sh"
      - "docs/mainnet-settlement-runbook.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settlement-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      # Do not compile PR-head code. The audited 3ea79363 source is the candidate.
      - name: Checkout exact reviewed implementation
        uses: actions/checkout@v4
        with:
          ref: 3ea79363695dd93be5f0a5e8a5121cf6e31d27b8
          persist-credentials: false
          fetch-depth: 1

      - name: Prove exact source and clean worktree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3ea79363695dd93be5f0a5e8a5121cf6e31d27b8"
          test -z "$(git status --porcelain)"

      - name: Install pinned Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test settlement verification
        shell: bash
        run: |
          set -euo pipefail
          go test -tags go1.27 ./cmd/wolochaind/cmd -count=1

      - name: Build audited linux/amd64 candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate
          GOOS=linux GOARCH=amd64 go build -trimpath=false -tags go1.27 -o candidate/wolochaind-settlement-only-linux-amd64 ./cmd/wolochaind
          go version -m candidate/wolochaind-settlement-only-linux-amd64 | tee candidate/go-build-metadata.txt
          grep -Eq 'vcs.revision=3ea79363695dd93be5f0a5e8a5121cf6e31d27b8$' candidate/go-build-metadata.txt
          grep -Eq 'vcs.modified=false$' candidate/go-build-metadata.txt
          sha256sum candidate/wolochaind-settlement-only-linux-amd64 | tee candidate/SHA256SUMS
          printf 'reviewed_source_commit=3ea79363695dd93be5f0a5e8a5121cf6e31d27b8\n' > candidate/SOURCE.txt
          printf 'production_authorized=false\nconsensus_upgrade_authorized=false\n' >> candidate/SOURCE.txt

      # Artifacts are transient, non-executable release candidates, not a
      # production deployment or a certification of live custody.
      - name: Retain candidate and provenance for operator review
        uses: actions/upload-artifact@v4
        with:
          name: wolo-settlement-3ea79363-linux-amd64-UNDEPLOYED
          path: candidate/
          if-no-files-found: error
          retention-days: 14
