name: Reviewed mainnet-prep documentation seal
on:
  push:
    branches:
      - docs/20261022-mainnet-source-review
permissions:
  contents: write
concurrency:
  group: wolo-reviewed-mainnet-source-docs
  cancel-in-progress: false
jobs:
  seal:
    if: github.repository == 'Emaren/wolochain' && github.ref == 'refs/heads/docs/20261022-mainnet-source-review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Refresh generated documentation after actual source-only review
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = docs/20261022-mainnet-source-review
          if python3 scripts/docs_v2_check.py; then
            echo "Document registry already matches reviewed source"
            exit 0
          fi
          python3 scripts/docs_v2_check.py --write
          python3 scripts/docs_v2_check.py
          git diff --check
          changed="$(git diff --name-only)"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              docs/document-registry.json|docs/DOCUMENTATION_CONTROL_PLANE.md|catalog-info.yaml) ;;
              *) echo "REFUSE non-generated metadata path: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          git add docs/document-registry.json docs/DOCUMENTATION_CONTROL_PLANE.md catalog-info.yaml
          git config user.name 'wolo-reviewed-document-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs(mainnet): seal three reviewed source documents against existing implementation baseline"
          git push origin HEAD:refs/heads/docs/20261022-mainnet-source-review
